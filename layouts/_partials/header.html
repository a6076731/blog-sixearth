<header class="header">
    <nav class="header-nav">
        <div class="logo">
            <a href="{{ "" | absLangURL }}" accesskey="h" title="{{ site.Title }} (Alt + H)">
                {{- site.Title -}}
            </a>
            {{- if (not site.Params.disableThemeToggle) }}
            <div class="logo-switches">
                <button id="theme-toggle" class="theme-toggle" accesskey="t" title="(Alt + T)"
                    aria-label="切换深浅色">
                    <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
            {{- end }}
        </div>

        {{- /* 三站通用导航：首页 / 博客（下拉到站内栏目）/ 相册 */ -}}
        {{- $current := . }}
        <div class="site-switch">
            <a class="ss-link" href="https://sixearth.cn/">首页</a>

            <div class="ss-drop" id="blogDrop">
                <button class="ss-trigger is-current" id="blogTrigger" type="button"
                    aria-haspopup="true" aria-expanded="false" aria-controls="blogMenu">
                    博客<span class="ss-caret" aria-hidden="true"></span>
                </button>
                <ul class="ss-menu" id="blogMenu">
                    {{- range site.Menus.main }}
                    {{- $url := .URL | absLangURL }}
                    <li>
                        <a href="{{ $url }}" {{- if eq $url $current.Permalink }} class="active"{{ end }}>
                            {{- .Name -}}
                        </a>
                    </li>
                    {{- end }}
                </ul>
            </div>

            <a class="ss-link" href="https://img.sixearth.cn/">相册</a>

            <a class="ss-link ss-mail" href="mailto:hi@sixearth.cn" aria-label="来信 hi@sixearth.cn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>
                    <path d="m3.2 6.6 8.8 6 8.8-6"></path>
                </svg>
                <span class="ss-mail-label">来信</span>
            </a>
        </div>
    </nav>
</header>

<script>
    (function () {
        var drop = document.getElementById('blogDrop');
        var trigger = document.getElementById('blogTrigger');
        if (!drop || !trigger) return;

        function setOpen(open) {
            drop.classList.toggle('is-open', open);
            trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        trigger.addEventListener('click', function (e) {
            e.preventDefault();
            setOpen(!drop.classList.contains('is-open'));
        });

        document.addEventListener('click', function (e) {
            if (!drop.contains(e.target)) setOpen(false);
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') setOpen(false);
        });
    })();
</script>
