baseURL = "https://blog.sixearth.cn/"
title = "Six Earth"
theme = "PaperMod"

locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  env = "production"
  description = "Six Earth的个人博客"
  author = "Six Earth"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "你好，我是Six Earth"
    Content = "这里记录一些想法、折腾和日常。"

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 40

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 50
